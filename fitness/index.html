<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Track your workouts, goals, and streaks">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitTrack</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="app-header">
    <h1 id="screen-title">Today</h1>
  </header>

  <main>
    <!-- Today -->
    <section id="today" class="screen active" data-title="Today">
      <div class="card goal-card">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fg" id="goal-ring" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="goal-text">
          <span class="goal-value" id="week-minutes">0</span>
          <span class="goal-label">of <span id="week-goal">150</span> min this week</span>
        </div>
      </div>

      <div class="stats">
        <div class="stat card">
          <span class="stat-value" id="today-minutes">0</span>
          <span class="stat-label">min today</span>
        </div>
        <div class="stat card">
          <span class="stat-value" id="today-calories">0</span>
          <span class="stat-label">kcal today</span>
        </div>
        <div class="stat card">
          <span class="stat-value" id="streak">0</span>
          <span class="stat-label">day streak</span>
        </div>
      </div>

      <div class="card">
        <h2>Last 7 days</h2>
        <div class="chart" id="week-chart"></div>
      </div>

      <div class="card">
        <h2>Today's workouts</h2>
        <ul class="workout-list" id="today-list"></ul>
      </div>
    </section>

    <!-- Log -->
    <section id="log" class="screen" data-title="Log Workout">
      <form id="workout-form" class="card form" novalidate>
        <label for="type">Activity</label>
        <select id="type" name="type" required></select>

        <div class="row">
          <div>
            <label for="duration">Duration (min)</label>
            <input type="number" id="duration" name="duration" min="1" max="1440" inputmode="numeric" required>
          </div>
          <div>
            <label for="distance">Distance (km)</label>
            <input type="number" id="distance" name="distance" min="0" step="0.01" inputmode="decimal" placeholder="Optional">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="calories">Calories</label>
            <input type="number" id="calories" name="calories" min="0" inputmode="numeric" placeholder="Auto">
          </div>
          <div>
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
          </div>
        </div>

        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3" placeholder="How did it feel?"></textarea>

        <p class="hint" id="calorie-hint"></p>
        <button type="submit" class="btn">Save Workout</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </section>

    <!-- History -->
    <section id="history" class="screen" data-title="History">
      <div class="card totals" id="all-time"></div>
      <div id="history-list"></div>
    </section>

    <!-- Settings -->
    <section id="settings" class="screen" data-title="Settings">
      <form id="settings-form" class="card form">
        <label for="goal">Weekly goal (minutes)</label>
        <input type="number" id="goal" min="10" max="5000" inputmode="numeric">

        <label for="weight">Body weight (kg)</label>
        <input type="number" id="weight" min="20" max="300" step="0.1" inputmode="decimal">
        <p class="hint">Used to estimate calories burned.</p>

        <button type="submit" class="btn">Save Settings</button>
        <p class="form-status" id="settings-status" role="status"></p>
      </form>

      <div class="card form">
        <h2>Your data</h2>
        <p class="hint">Everything is stored only on this device.</p>
        <button type="button" class="btn secondary" id="export-btn">Export as JSON</button>
        <button type="button" class="btn danger" id="clear-btn">Delete all workouts</button>
      </div>
    </section>
  </main>

  <nav class="tab-bar" aria-label="Main">
    <button class="tab active" data-screen="today"><span class="tab-icon">&#9673;</span>Today</button>
    <button class="tab" data-screen="log"><span class="tab-icon">&#65291;</span>Log</button>
    <button class="tab" data-screen="history"><span class="tab-icon">&#9776;</span>History</button>
    <button class="tab" data-screen="settings"><span class="tab-icon">&#9881;</span>Settings</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
